name: Build blog and pages
on:
  push:
    branches: [main]
    paths: ["blog-src/**", "pages-src/**", "tools/build_blog.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python3 tools/build_blog.py
      - name: Commit built pages
        run: |
          git config user.name "Heritage site builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Rebuild blog and pages" && git push)
